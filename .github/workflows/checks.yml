name: Repository checks

on:
  push:
    branches: [main, 'research/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate progress dashboard
        run: python3 comparison/dashboard.py --check
      - name: Validate repository and frozen scorer
        run: python3 tools/check_repository.py
      - name: Validate the six-dimension OpenClaw design
        run: python3 evaluation/tools/check_design.py
      - name: Test campaign gates, fixture acceptance and cost accounting
        run: python3 -m unittest discover -s evaluation/tests -v
