name: Real-model billing reconciliation experiments
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [formal, calibration]
        default: formal
        description: Calibrate real native accounting before prescribed formal units
      scenario_ids:
        type: string
        default: '["COST-07-S01","COST-07-S02","COST-07-S03","COST-07-S04","COST-07-S05","COST-07-S06"]'
        description: JSON array of pending formal scenarios; calibration exercises the whole family
      units:
        type: string
        default: '[1,2,3,4,5,6]'
        description: JSON array of pending unit indices only
permissions:
  contents: read
concurrency:
  group: openclaw-cost07-real-accounting
  cancel-in-progress: false
jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      EVAL_SCENARIOS: ${{ inputs.scenario_ids }}
      EVAL_UNITS: ${{ inputs.units }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reject already accepted accounting scenarios
        run: |
          python3 - <<'PY'
          import sys,json,os
          sys.path.insert(0,'evaluation/tools')
          from campaign import DEFAULT_PLAN,records_from
          selected=json.loads(os.environ['EVAL_SCENARIOS'])
          units=json.loads(os.environ['EVAL_UNITS'])
          assert units and all(type(u) is int and 1<=u<=6 for u in units)
          assert selected and set(selected)<={f'COST-07-S{i:02}' for i in range(1,7)}
          assert not any(r['scenario_id'] in selected and r['unit'] in units and r['state'] in {'pass','fail'} for r in records_from(DEFAULT_PLAN.parent/'results'))
          PY
      - name: Prepare one disposable pinned runtime
        uses: ./.github/actions/evaluation-runtime
      - name: Calibrate and execute native real-provider accounting serially
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EVAL_MODE: ${{ inputs.mode }}
        run: |
          sudo --preserve-env=DEEPSEEK_API_KEY,GITHUB_ACTIONS,GITHUB_RUN_ID,GITHUB_SHA python3 evaluation/tools/run_billing_family.py \
            --runtime-modules "$RUNNER_TEMP/openclaw-campaign-runtime/node_modules" \
            --package-lock "$RUNNER_TEMP/openclaw-campaign-runtime/package-lock.json" \
            --node "$(command -v node)" --output "$RUNNER_TEMP/openclaw-campaign-result" --mode "$EVAL_MODE" --scenarios-json "$EVAL_SCENARIOS" --units-json "$EVAL_UNITS"
      - name: Retain bounded accounting and installation provenance
        if: always()
        run: |
          sudo mkdir -p "$RUNNER_TEMP/openclaw-campaign-result/provenance"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/openclaw-campaign-result"
          if test -d "$RUNNER_TEMP/openclaw-campaign-metadata"; then
            cp "$RUNNER_TEMP/openclaw-campaign-metadata/"*.json "$RUNNER_TEMP/openclaw-campaign-result/provenance/"
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'openclaw-campaign-result'
          assert sum(f.stat().st_size for f in p.rglob('*') if f.is_file())<=8*1024**2
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: campaign-COST-07
          path: ${{ runner.temp }}/openclaw-campaign-result/
          retention-days: 30
          if-no-files-found: error
      - name: Remove owned runtime, cache and state
        if: always()
        run: sudo rm -rf -- "$RUNNER_TEMP/openclaw-campaign-runtime" "$RUNNER_TEMP/openclaw-campaign-cache" "$RUNNER_TEMP/openclaw-campaign-metadata" "$RUNNER_TEMP/openclaw-campaign-result"
