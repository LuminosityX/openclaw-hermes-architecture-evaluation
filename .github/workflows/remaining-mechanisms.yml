name: Remaining mechanism experiments

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Formal execution or development-only diagnostic calibration
        type: choice
        options: [formal, calibration]
        default: formal
      families:
        description: JSON array of new unmeasured families; existing accepted units are rejected
        default: '["PERF-01","PERF-02","PERF-04","COST-02","COST-04","OBS-07"]'
        required: true
        type: string
      scenario_ids:
        description: Optional JSON array of explicitly pending scenarios within the selected family
        default: '[]'
        required: true
        type: string

permissions:
  contents: read

jobs:
  execute:
    concurrency:
      group: openclaw-formal-family-${{ matrix.family }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        family: ${{ fromJSON(inputs.families) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EVAL_FAMILY: ${{ matrix.family }}
      EVAL_MODE: ${{ inputs.mode }}
      EVAL_SCENARIOS: ${{ inputs.scenario_ids }}
      EVAL_TMPFS_MIB: ${{ matrix.family == 'REL-10' && 384 || (matrix.family == 'OBS-02' || matrix.family == 'OBS-04' || matrix.family == 'REL-07' || matrix.family == 'REL-12' || matrix.family == 'SEC-12' || matrix.family == 'OBS-01' || matrix.family == 'EXT-04' || matrix.family == 'SEC-04' || matrix.family == 'EXT-02' || matrix.family == 'SEC-02' || matrix.family == 'SEC-06' || matrix.family == 'REL-01') && 128 || 64 }}
    steps:
      - name: Check out evaluation sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reject already accepted units before installing a runtime
        run: |
          python3 - <<'PY'
          import os,sys
          sys.path.insert(0,'evaluation/tools')
          from campaign import DEFAULT_PLAN,load_plan,records_from
          from run_campaign_family import NATIVE_FAMILIES
          family=os.environ['EVAL_FAMILY']
          assert family in NATIVE_FAMILIES
          import json
          case=next(c for c in load_plan()['cases'] if c['id']==family)
          selected=json.loads(os.environ['EVAL_SCENARIOS']) or [s['id'] for s in case['scenarios']]
          assert len(selected)==len(set(selected)) and set(selected)<={s['id'] for s in case['scenarios']}
          if os.environ['EVAL_MODE']=='formal':
              assert not any(r['scenario_id'] in selected and r['state'] in {'pass','fail'} for r in records_from(DEFAULT_PLAN.parent/'results')), 'Accepted formal units already exist; select only pending work'
          PY
      - name: Prepare one disposable pinned runtime
        uses: ./.github/actions/evaluation-runtime
      - name: Expose only the existing npm CLI for owned dependency-registry experiments
        if: matrix.family == 'REL-07' || matrix.family == 'REL-12' || matrix.family == 'SEC-12'
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,os,shutil
          from pathlib import Path
          cli=Path(shutil.which('npm')).resolve()
          root=cli.parent.parent
          package=json.loads((root/'package.json').read_text())
          assert package['name']=='npm' and cli==root/'bin/npm-cli.js'
          files=[p for p in root.rglob('*') if p.is_file() and not p.is_symlink()]
          assert sum(p.stat().st_size for p in files)<=32*1024**2
          metadata=dict(npm_root=str(root),npm_version=package['version'],npm_cli_sha256=hashlib.sha256(cli.read_bytes()).hexdigest(),
              scope='Read-only npm executable package and its own tooling dependencies only. No host project packages are exposed, no extra tool is installed.')
          destination=Path(os.environ['RUNNER_TEMP'])/'openclaw-campaign-runtime/owned-npm-toolchain.json'
          destination.write_text(json.dumps(metadata)+'\n')
          (Path(os.environ['RUNNER_TEMP'])/'openclaw-campaign-metadata/npm-toolchain.json').write_text(json.dumps(metadata)+'\n')
          PYCODE
      - name: Install official OTLP addon through native OpenClaw only for collector experiments
        if: matrix.family == 'OBS-02'
        env:
          npm_config_cache: ${{ runner.temp }}/openclaw-campaign-cache
          npm_config_update_notifier: 'false'
          npm_config_fund: 'false'
          npm_config_audit: 'false'
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,npm_config_cache,npm_config_update_notifier,npm_config_fund,npm_config_audit python3 evaluation/tools/prepare_observability_addon.py \
            --runtime-modules "$RUNNER_TEMP/openclaw-campaign-runtime/node_modules" \
            --node "$(command -v node)" --metadata "$RUNNER_TEMP/openclaw-campaign-metadata"
          test "$(du -sm "$RUNNER_TEMP/openclaw-campaign-runtime" "$RUNNER_TEMP/openclaw-campaign-cache" | awk '{s+=$1} END {print s}')" -le 4096
      - name: Resolve the executable and prepare owned UID-readable toolchain if needed
        run: |
          python3 - <<'PY'
          import hashlib,json,os,shutil,stat
          from pathlib import Path
          source=Path(shutil.which('node')).resolve()
          selected=source
          if os.environ['EVAL_FAMILY']=='REL-06':
              selected=Path(os.environ['RUNNER_TEMP'])/'openclaw-campaign-runtime/owned-uid-node'
              shutil.copyfile(source,selected)
              selected.chmod(0o755)
              source_hash=hashlib.sha256(source.read_bytes()).hexdigest()
              selected_hash=hashlib.sha256(selected.read_bytes()).hexdigest()
              assert source_hash==selected_hash
              metadata=dict(scope='One Node executable clone on the disposable host only; OpenClaw installation is not copied',
                  bytes=selected.stat().st_size,source_mode=oct(stat.S_IMODE(source.stat().st_mode)),clone_mode='0o755',sha256=selected_hash)
              (Path(os.environ['RUNNER_TEMP'])/'openclaw-campaign-metadata/uid-node-clone.json').write_text(json.dumps(metadata)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as output:output.write('EVAL_NODE_PATH='+str(selected)+'\n')
          PY
          test "$(du -sm "$RUNNER_TEMP/openclaw-campaign-runtime" "$RUNNER_TEMP/openclaw-campaign-cache" | awk '{s+=$1} END {print s}')" -le 4096
      - name: Prepare the owned SSH sandbox test backend
        if: matrix.family == 'SEC-03'
        run: test -x /usr/sbin/sshd || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends openssh-server; }
      - name: Calibrate the selected adapter against native OpenClaw
        run: |
          sudo python3 evaluation/tools/run_local.py \
            --runtime-modules "$RUNNER_TEMP/openclaw-campaign-runtime/node_modules" \
            --node "$EVAL_NODE_PATH" --adapter-validation "$EVAL_FAMILY" --hosted-profile --ssh-backend \
            --memory-mib 3072 --tmpfs-mib "$EVAL_TMPFS_MIB" --timeout 600 --output "$RUNNER_TEMP/openclaw-campaign-validation"
          sudo mkdir -p "$RUNNER_TEMP/openclaw-campaign-proofs"
          sudo cp "$RUNNER_TEMP/openclaw-campaign-validation/summary.json" \
            "$RUNNER_TEMP/openclaw-campaign-proofs/adapter-validation-$GITHUB_RUN_ID-$EVAL_FAMILY.json"
      - name: Execute all prescribed independent units only after matching calibration
        if: inputs.mode == 'formal'
        run: |
          python3 - <<'PY'
          import json,os,shutil,subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          command=['sudo','--preserve-env=GITHUB_ACTIONS,GITHUB_RUN_ID,GITHUB_SHA','python3','evaluation/tools/run_campaign_family.py',
              '--runtime-modules',str(root/'openclaw-campaign-runtime/node_modules'),
              '--package-lock',str(root/'openclaw-campaign-runtime/package-lock.json'),
              '--node',os.environ['EVAL_NODE_PATH'],'--case',os.environ['EVAL_FAMILY'],
              '--proofs',str(root/'openclaw-campaign-proofs'),'--output',str(root/'openclaw-campaign-result')]
          selected=json.loads(os.environ['EVAL_SCENARIOS'])
          if selected:command+=['--scenarios',*selected]
          subprocess.run(command,check=True)
          PY
      - name: Collect bounded calibration and formal provenance
        if: always()
        run: |
          sudo mkdir -p "$RUNNER_TEMP/openclaw-campaign-result/provenance"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/openclaw-campaign-result"
          if test -d "$RUNNER_TEMP/openclaw-campaign-metadata"; then
            cp "$RUNNER_TEMP/openclaw-campaign-metadata/"*.json "$RUNNER_TEMP/openclaw-campaign-result/provenance/"
          fi
          if sudo test -f "$RUNNER_TEMP/openclaw-campaign-validation/summary.json"; then
            sudo cp "$RUNNER_TEMP/openclaw-campaign-validation/summary.json" "$RUNNER_TEMP/openclaw-campaign-result/provenance/adapter-validation-$GITHUB_RUN_ID-$EVAL_FAMILY.json"
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/openclaw-campaign-result"
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'openclaw-campaign-result'
          assert sum(p.stat().st_size for p in root.rglob('*') if p.is_file())<=8*1024**2
          PY
      - name: Upload bounded native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.mode == 'formal' && format('campaign-{0}', matrix.family) || format('native-adapter-validation-{0}', matrix.family) }}
          path: ${{ runner.temp }}/openclaw-campaign-result/
          retention-days: 30
          if-no-files-found: error
      - name: Remove this job's installation, caches, proofs and state
        if: always()
        run: sudo rm -rf -- "$RUNNER_TEMP/openclaw-campaign-runtime" "$RUNNER_TEMP/openclaw-campaign-cache" "$RUNNER_TEMP/openclaw-campaign-metadata" "$RUNNER_TEMP/openclaw-campaign-validation" "$RUNNER_TEMP/openclaw-campaign-proofs" "$RUNNER_TEMP/openclaw-campaign-result"
