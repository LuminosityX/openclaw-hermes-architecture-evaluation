name: Retain formal campaign evidence in GitHub

on:
  workflow_run:
    workflows: [Remaining mechanism experiments, Real-model injection experiments]
    types: [completed]
  workflow_dispatch:
    inputs:
      runs:
        description: 'JSON array: [{"run_id":123,"exclude_scenarios":[],"exclusion_reason":null}]'
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: retain-formal-campaign
  cancel-in-progress: false

jobs:
  retain:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Validate and retain bounded hosted evidence without a runtime installation
        env:
          GH_TOKEN: ${{ github.token }}
          EVAL_RETENTION_RUNS: ${{ inputs.runs }}
          EVAL_COMPLETED_RUN: ${{ github.event.workflow_run.id }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          runs=json.loads(os.environ['EVAL_RETENTION_RUNS']) if os.environ.get('EVAL_RETENTION_RUNS') else [dict(run_id=int(os.environ['EVAL_COMPLETED_RUN']))]
          assert isinstance(runs,list) and 1<=len(runs)<=20
          for item in runs:
              assert type(item['run_id']) is int and item['run_id']>0
              prefix='repos/'+os.environ['GITHUB_REPOSITORY']+'/'
              artifacts=json.loads(subprocess.check_output(['gh','api',prefix+'actions/runs/'+str(item['run_id'])+'/artifacts?per_page=100']))['artifacts']
              if not any(a['name'].startswith('campaign-') for a in artifacts):
                  print('No formal artifacts; development calibration does not count.',item['run_id'])
                  continue
              command=['python3','evaluation/tools/retain_campaign_results.py','--run-id',str(item['run_id'])]
              excluded=item.get('exclude_scenarios',[])
              assert isinstance(excluded,list) and all(isinstance(s,str) for s in excluded)
              if excluded:
                  assert isinstance(item.get('exclusion_reason'),str) and item['exclusion_reason']
                  command+=['--exclude-scenarios',*excluded,'--exclusion-reason',item['exclusion_reason']]
              subprocess.run(command,check=True)
              subprocess.run(['python3','evaluation/tools/retain_provider_usage.py','--run-id',str(item['run_id'])],check=True)
          PY
          python3 evaluation/tools/update_campaign_progress.py
          python3 evaluation/tools/campaign.py status
          python3 -m unittest discover -s evaluation/tests -p 'test_campaign*.py'
      - name: Commit compact evidence and derived progress to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evaluation/campaigns README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Retain verified cloud campaign evidence and refresh progress'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
