name: Real-model injection experiments

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openclaw-formal-family-SEC-09
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reject accepted tasks before installing anything
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'evaluation/tools')
          from campaign import DEFAULT_PLAN,records_from
          assert not any(r['scenario_id'].startswith('SEC-09-') and r['state'] in {'pass','fail'} for r in records_from(DEFAULT_PLAN.parent/'results'))
          PY
      - name: Prepare the shared disposable pinned runtime
        uses: ./.github/actions/evaluation-runtime
      - name: Calibrate all five surfaces with both a benign and a leaking native transcript
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,GITHUB_RUN_ID,GITHUB_SHA python3 evaluation/tools/run_injection_family.py \
            --runtime-modules "$RUNNER_TEMP/openclaw-campaign-runtime/node_modules" \
            --package-lock "$RUNNER_TEMP/openclaw-campaign-runtime/package-lock.json" \
            --node "$(command -v node)" --output "$RUNNER_TEMP/openclaw-campaign-result" --mode calibration
      - name: Run fifteen real DeepSeek tasks after complete matching calibration
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          sudo --preserve-env=DEEPSEEK_API_KEY,GITHUB_ACTIONS,GITHUB_RUN_ID,GITHUB_SHA python3 evaluation/tools/run_injection_family.py \
            --runtime-modules "$RUNNER_TEMP/openclaw-campaign-runtime/node_modules" \
            --package-lock "$RUNNER_TEMP/openclaw-campaign-runtime/package-lock.json" \
            --node "$(command -v node)" --output "$RUNNER_TEMP/openclaw-campaign-result" --mode formal
      - name: Retain bounded evidence and installation provenance
        if: always()
        run: |
          sudo mkdir -p "$RUNNER_TEMP/openclaw-campaign-result/provenance"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/openclaw-campaign-result"
          if test -d "$RUNNER_TEMP/openclaw-campaign-metadata"; then
            cp "$RUNNER_TEMP/openclaw-campaign-metadata/"*.json "$RUNNER_TEMP/openclaw-campaign-result/provenance/"
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'openclaw-campaign-result'
          assert sum(p.stat().st_size for p in root.rglob('*') if p.is_file())<=8*1024**2
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: campaign-SEC-09
          path: ${{ runner.temp }}/openclaw-campaign-result/
          retention-days: 30
          if-no-files-found: error
      - name: Remove owned runtime, cache and state
        if: always()
        run: sudo rm -rf -- "$RUNNER_TEMP/openclaw-campaign-runtime" "$RUNNER_TEMP/openclaw-campaign-cache" "$RUNNER_TEMP/openclaw-campaign-metadata" "$RUNNER_TEMP/openclaw-campaign-result"
